<!DOCTYPE html>
<!-- =============================================================================
     index.html — COMEÇA JÁ (tela única: "Hoje")
     -----------------------------------------------------------------------------
     App contra a procrastinação: lista do dia + cronômetro "Começar agora" de 5 minutos.
     Por enquanto os dados ficam no próprio aparelho (js/armazenamento.js).
     ============================================================================= -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>StartNow</title>

  <!-- PWA: deixa o app instalável no celular (Android/iPhone) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3b6fd6" />
  <!-- Cores e tema: roda já no <head> para a página nascer com a cor escolhida (sem piscar) -->
  <script src="js/tema.js"></script>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="StartNow" />
  <link rel="icon" type="image/png" href="icones/icone-192.png" />
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/componentes.css" />
  <link rel="stylesheet" href="css/hoje.css" />
</head>
<body>

  <!-- 1) "Oi, digite seu nome" (js/perfil.js)  e  2) "Criar lista de tarefas" -->
  <div class="tela-cheia" id="entrada" hidden></div>
  <div class="tela-cheia" id="criar-lista" hidden></div>

  <!-- 3) O app -->
  <div id="app" hidden>
    <header class="topo">
      <div class="marca"><span class="marca-icone">S</span><span>StartNow</span></div>
      <div class="topo-espaco"></div>
      <span class="selo-sequencia" id="selo-sequencia" hidden></span>
      <button type="button" class="botao-icone" id="botao-personalizar" aria-label="Personalizar cores" title="Personalizar cores"></button>
      <div class="perfil-caixa">
        <button type="button" class="avatar" id="botao-perfil" aria-label="Menu da pessoa"></button>
        <div class="menu-perfil" id="menu-perfil" hidden>
          <p>Olá, <strong id="menu-nome"></strong></p>
          <button type="button" class="botao botao-borda botao-pequeno botao-largo" id="botao-sair">Sair</button>
        </div>
      </div>
    </header>

    <main class="conteudo">
      <nav class="semana" id="semana" aria-label="Próximos dias"></nav>
      <section class="cartao resumo" id="resumo" aria-live="polite"></section>
      <section class="aviso-pendentes" id="aviso-pendentes" hidden></section>
      <div id="formulario-principal"></div>
      <div class="barra-lista" id="barra-lista"></div>
      <div id="grupos"></div>
      <p class="vazio" id="vazio" hidden></p>
    </main>
  </div>

  <!-- Painel "Editar tarefa" (js/editar.js) -->
  <div class="painel" id="painel-editar" hidden></div>

  <!-- Painel "Categorias" (js/categorias.js) -->
  <div class="painel" id="painel-categorias" hidden></div>

  <!-- Painel "Personalizar" (desenhado por js/personalizar.js) -->
  <div class="painel" id="painel" hidden></div>

  <!-- Cronômetro "Começar agora" (desenhado por js/foco.js) -->
  <div class="foco" id="foco" hidden></div>

  <!-- Aviso rápido no pé da tela -->
  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <!-- Scripts: a ORDEM importa (config primeiro, a tela por último) -->
  <script src="js/config.js"></script>
  <script src="js/logica.js"></script>
  <script src="js/utilitarios.js"></script>
  <script src="js/nuvem.js"></script>
  <script src="js/armazenamento.js"></script>
  <script src="js/horas.js"></script>
  <script src="js/personalizar.js"></script>
  <script src="js/categorias.js"></script>
  <script src="js/editar.js"></script>
  <script src="js/foco.js"></script>
  <script src="js/formulario.js"></script>
  <script src="js/perfil.js"></script>
  <script src="js/hoje.js"></script>
  <script src="js/iniciar.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
